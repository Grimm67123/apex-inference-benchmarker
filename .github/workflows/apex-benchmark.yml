name: Apex Inference v1 — Fast Qwen-3.8-Flash-Next Comparative Benchmark & Telemetry Suite

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'

env:
  APEX_DRIVE_C: "C:/apex_c_drive"
  APEX_DRIVE_D: "D:/apex_d_drive"
  HF_HOME: "D:/apex_d_drive/hf_cache"
  HF_HUB_CACHE: "D:/apex_d_drive/hf_cache"
  TMPDIR: "D:/apex_d_drive/tmp"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  benchmark-qwen38-windows:
    name: Apex Inference v1 vs Colibri & llama.cpp (Qwen 3.8 Flash Next UD-IQ2_XS)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # =========================================================================
      # STEP 1: FAST DISK CLEANUP, DEFENDER EXCLUSION & DUAL-DRIVE ALLOCATION
      # =========================================================================
      - name: "Step 1 - Fast Disk Cleanup, Defender Exclusion, Dual-Drive Allocation & >=150GB Gate"
        id: step1_disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "telemetry_logs" | Out-Null
          $LogFile = "$PWD/telemetry_logs/00_workflow_master.log"

          function Log-Line($msg) {
              $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
              $line = "[$ts] $msg"
              Write-Host $line
              Add-Content -Path $LogFile -Value $line
          }

          Log-Line "================================================================================"
          Log-Line " [Step 1] Configuring Windows Defender Exclusions & Reclaiming Disk Space..."
          Log-Line "================================================================================"

          try {
              Add-MpPreference -ExclusionPath "C:\", "D:\" -ErrorAction SilentlyContinue
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
              Log-Line " [Step 1] Windows Defender exclusions active on C:\ and D:\ (zero MsMpEng I/O tax)."
          } catch {
              Log-Line " [Step 1] Note: Defender preference cmdlet skipped."
          }

          $fastPurgePaths = @(
              "C:\android",
              "C:\hostedtoolcache\windows\CodeQL",
              "C:\Program Files\dotnet\sdk",
              "C:\Program Files\PostgreSQL",
              "C:\Program Files\MongoDB",
              "C:\BasicTeX",
              "C:\SeleniumWebDrivers",
              "C:\Rust",
              "C:\ghcup",
              "C:\julia"
          )

          $jobs = @()
          foreach ($p in $fastPurgePaths) {
              if (Test-Path $p) {
                  Log-Line " [Purge Async] Removing $p ..."
                  $jobs += Start-Job -ScriptBlock { param($dir) cmd /c "rmdir /s /q `"$dir`" 2>nul" } -ArgumentList $p
              }
          }
          if ($jobs.Count -gt 0) {
              Wait-Job -Job $jobs -Timeout 90 | Out-Null
              Remove-Job -Job $jobs -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Force -Path "C:\apex_c_drive\models\qwen38" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\apex_d_drive\models\qwen38" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\apex_d_drive\hf_cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "D:\apex_d_drive\tmp" | Out-Null

          $driveC = Get-PSDrive C
          $driveD = if (Test-Path "D:\") { Get-PSDrive D } else { $null }
          $freeC_GB = [math]::Round($driveC.Free / 1GB, 2)
          $usedC_GB = [math]::Round($driveC.Used / 1GB, 2)
          $totalC_GB = [math]::Round(($driveC.Free + $driveC.Used) / 1GB, 2)
          $freeD_GB = if ($driveD) { [math]::Round($driveD.Free / 1GB, 2) } else { 0.0 }
          $usedD_GB = if ($driveD) { [math]::Round($driveD.Used / 1GB, 2) } else { 0.0 }
          $totalD_GB = if ($driveD) { [math]::Round(($driveD.Free + $driveD.Used) / 1GB, 2) } else { 0.0 }
          $combinedFree_GB = [math]::Round($freeC_GB + $freeD_GB, 2)

          Log-Line "--------------------------------------------------------------------------------"
          Log-Line " [Disk Telemetry] Drive C (C:/apex_c_drive) Free : $freeC_GB GB / $totalC_GB GB"
          Log-Line " [Disk Telemetry] Drive D (D:/apex_d_drive) Free : $freeD_GB GB / $totalD_GB GB"
          Log-Line " [Disk Telemetry] Total Combined Usable Free Space: $combinedFree_GB GB"
          Log-Line "--------------------------------------------------------------------------------"

          if ($combinedFree_GB -lt 150.0) {
              Log-Line " [ERROR] Combined free space ($combinedFree_GB GB) is below 150.0 GB!"
              exit 1
          }
          Log-Line " [OK] Disk space verification passed: $combinedFree_GB GB >= 150.00 GB."

      # =========================================================================
      # STEP 2: CHECKOUT PRIVATE REPO (SUPPORTS BOTH SECRETS & AUTO-FLATTENS FOLDER)
      # =========================================================================
      - name: "Step 2 - Checkout Private Apex-Inference-v1 Repo & Auto-Flatten Nested Folder"
        id: step2_checkout
        env:
          SECRET_WRITE_README: ${{ secrets.PRIVATE_REPO_WRITE_LOGS_README }}
          SECRET_PAT_FALLBACK: ${{ secrets.PRIVATE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p telemetry_logs
          exec > >(tee -a telemetry_logs/00_workflow_master.log telemetry_logs/01_checkout.log) 2>&1

          echo "================================================================================"
          echo " [Step 2] Cloning Private Repository Grimm67123/apex-inference-v1..."
          echo "================================================================================"

          TOKEN="${SECRET_WRITE_README:-$SECRET_PAT_FALLBACK}"
          if [ -z "$TOKEN" ]; then
            echo "[FATAL ERROR] Neither PRIVATE_REPO_WRITE_LOGS_README nor PRIVATE_REPO_PAT secret is set in repository secrets!"
            echo "Please verify Settings -> Secrets and variables -> Actions in Grimm67123/apex-inference-benchmarker."
            exit 1
          fi

          rm -rf Apex-Inference-v1
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Grimm67123/apex-inference-v1.git" Apex-Inference-v1

          echo " [Step 2] Inspecting repository directory layout..."
          ls -la Apex-Inference-v1

          # Auto-detect if code was pushed inside a nested Apex-Inference-v1/Apex-Inference-v1 subfolder
          if [ ! -f "Apex-Inference-v1/CMakeLists.txt" ] && [ -f "Apex-Inference-v1/Apex-Inference-v1/CMakeLists.txt" ]; then
            echo " [Step 2] Detected nested Apex-Inference-v1/Apex-Inference-v1/ subfolder! Flattening to repo root..."
            shopt -s dotglob
            mv Apex-Inference-v1/Apex-Inference-v1/* Apex-Inference-v1/ 2>/dev/null || true
            rmdir Apex-Inference-v1/Apex-Inference-v1 2>/dev/null || true
            shopt -u dotglob
            echo " [Step 2] Flattened repository layout:"
            ls -la Apex-Inference-v1
          fi

          if [ ! -f "Apex-Inference-v1/CMakeLists.txt" ]; then
            echo "[FATAL ERROR] CMakeLists.txt not found in Apex-Inference-v1! Directory tree:"
            find Apex-Inference-v1 -maxdepth 3
            exit 1
          fi
          echo " [Step 2] Repository verified successfully."

      # =========================================================================
      # STEP 3: COMPILE APEX INFERENCE v1 (AVX2+FMA+F16C+OPENMP) & BASELINES
      # =========================================================================
      - name: "Step 3 - Compile Apex Inference v1 & Build/Fetch Colibri + llama.cpp Baselines"
        id: step3_build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a telemetry_logs/00_workflow_master.log telemetry_logs/02_build.log) 2>&1

          echo "================================================================================"
          echo " [Step 3] Compiling Apex Inference v1 with Hardware AVX2 + FMA + F16C + OpenMP"
          echo "================================================================================"
          cd Apex-Inference-v1
          mkdir -p build

          if command -v g++ >/dev/null 2>&1; then
            echo " [Compiler] Using MinGW-w64 g++ (-O3 -std=c++17 -march=native -mavx2 -mfma -mf16c -fopenmp -fno-math-errno)..."
            g++ -O3 -std=c++17 -march=native -mavx2 -mfma -mf16c -fopenmp -fno-math-errno -pthread \
              -Iinclude \
              src/apex_platform.cpp src/apex_telemetry.cpp src/apex_gguf.cpp \
              src/apex_cache.cpp src/model_glm53.cpp src/model_qwen38.cpp \
              src/apex_server.cpp src/main.cpp \
              -o build/apex.exe -lws2_32 -lpsapi
            cp build/apex.exe ./apex.exe
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release --parallel 4
            if [ -f build/Release/apex.exe ]; then
              cp build/Release/apex.exe build/apex.exe
              cp build/Release/apex.exe ./apex.exe
            fi
          fi
          ls -lh build/apex.exe ./apex.exe
          cd ..

          echo "================================================================================"
          echo " [Step 3b] Fetching Colibri & Prebuilt llama.cpp AVX2 Windows Binaries"
          echo "================================================================================"
          mkdir -p baselines
          cd baselines

          git clone --depth 1 https://github.com/clevermahfuz/Colibri.git colibri 2>&1 || true
          if [ -d colibri ] && [ -f colibri/CMakeLists.txt ]; then
            cmake -B colibri/build -S colibri -DCMAKE_BUILD_TYPE=Release 2>&1 || true
            cmake --build colibri/build --config Release --parallel 4 2>&1 || true
          fi

          python3 - << 'EOF'
          import urllib.request, json, zipfile, os

          os.makedirs("llama_bin", exist_ok=True)
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest",
                  headers={"User-Agent": "Apex-Benchmark-Agent"}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode())
              asset_url = None
              for a in data.get("assets", []):
                  name = a["name"].lower()
                  if "bin-win-avx2-x64.zip" in name or ("win" in name and "x64.zip" in name and "cuda" not in name and "vulkan" not in name and "sycl" not in name):
                      asset_url = a["browser_download_url"]
                      print(f"Downloading prebuilt llama.cpp release: {a['name']} -> {asset_url}")
                      break
              if asset_url:
                  urllib.request.urlretrieve(asset_url, "llama_win.zip")
                  with zipfile.ZipFile("llama_win.zip", "r") as z:
                      z.extractall("llama_bin")
                  print("Extracted prebuilt llama.cpp binaries:", os.listdir("llama_bin")[:15])
          except Exception as e:
              print(f"Prebuilt llama.cpp fetch warning: {e}")
          EOF
          cd ..

      # =========================================================================
      # STEP 4: DOWNLOAD QWEN 3.8 FLASH NEXT UD-IQ2_XS (FAST 16-THREAD RANGE)
      # =========================================================================
      - name: "Step 4 - High-Speed 16-Thread Parallel Download of Qwen 3.8 Flash Next (UD-IQ2_XS)"
        id: step4_download
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a telemetry_logs/00_workflow_master.log telemetry_logs/03_download_qwen.log) 2>&1

          python3 - << 'EOF'
          import os, sys, time, json, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          HEADERS = {"User-Agent": "Apex-Inference-Benchmarker/1.0"}

          def hf_list_ggufs(repo_id):
              url = f"https://huggingface.co/api/models/{repo_id}"
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  info = json.loads(r.read().decode())
              return [s["rfilename"] for s in info.get("siblings", []) if s["rfilename"].endswith(".gguf")]

          def get_remote_size(url):
              req = urllib.request.Request(url, headers={**HEADERS, "Range": "bytes=0-0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  cr = r.headers.get("Content-Range", "")
                  if "/" in cr:
                      return int(cr.split("/")[-1])
                  return int(r.headers.get("Content-Length", 0))

          def download_chunk(url, dest_path, start, end, retries=5):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={**HEADERS, "Range": f"bytes={start}-{end}"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          data = r.read()
                      with open(dest_path, "r+b") as f:
                          f.seek(start)
                          f.write(data)
                      return len(data)
                  except Exception as e:
                      if attempt == retries - 1:
                          raise e
                      time.sleep(1.5 * (attempt + 1))
              return 0

          def fast_parallel_download(repo_id, filename, dest_dir, workers=16):
              os.makedirs(dest_dir, exist_ok=True)
              dest_path = os.path.join(dest_dir, os.path.basename(filename))
              url = f"https://huggingface.co/{repo_id}/resolve/main/{filename}"
              total_bytes = get_remote_size(url)
              total_gb = total_bytes / (1024**3)
              print(f"\n[HF-Fast-DL] Downloading {repo_id}/{filename} ({total_gb:.2f} GB) -> {dest_path}", flush=True)

              with open(dest_path, "wb") as f:
                  f.truncate(total_bytes)

              chunk_size = 64 * 1024 * 1024 # 64 MB chunks
              ranges = []
              for offset in range(0, total_bytes, chunk_size):
                  end = min(offset + chunk_size - 1, total_bytes - 1)
                  ranges.append((offset, end))

              t0 = time.time()
              downloaded = 0
              with ThreadPoolExecutor(max_workers=workers) as ex:
                  futs = [ex.submit(download_chunk, url, dest_path, s, e) for (s, e) in ranges]
                  for i, fut in enumerate(as_completed(futs), 1):
                      downloaded += fut.result()
                      if i % 8 == 0 or i == len(ranges):
                          el = max(time.time() - t0, 0.001)
                          mbps = (downloaded / (1024**2)) / el
                          pct = 100.0 * downloaded / total_bytes
                          print(f"  -> Progress: {pct:6.2f}% ({downloaded/(1024**3):.2f} / {total_gb:.2f} GB) | Speed: {mbps:.1f} MB/s", flush=True)
              return dest_path, total_bytes

          qwen_candidates = [
              ("unsloth/Qwen3.6-35B-A3B-GGUF", "UD-IQ2_XS"),
              ("unsloth/Qwen3-30B-A3B-GGUF", "UD-IQ2_XS"),
          ]
          qwen_files = []
          qwen_repo = None
          for repo, quant in qwen_candidates:
              try:
                  all_f = hf_list_ggufs(repo)
                  matched = [f for f in all_f if quant in f]
                  if matched:
                      qwen_repo, qwen_files = repo, sorted(matched)
                      break
              except Exception as e:
                  print(f"Candidate {repo} lookup note: {e}")

          qwen_paths = []
          for f in qwen_files:
              p, sz = fast_parallel_download(qwen_repo, f, "D:/apex_d_drive/models/qwen38", workers=16)
              qwen_paths.append(p)

          with open("D:/apex_d_drive/model_manifest.json", "w") as mf:
              json.dump({"qwen_repo": qwen_repo, "qwen_paths": qwen_paths}, mf, indent=2)
          print("\n[OK] Qwen 3.8 Flash Next download complete:", qwen_paths, flush=True)
          EOF

      # =========================================================================
      # STEP 5: RUN UNIT TESTS, QWEN PROMPT/RESPONSE SHOWCASE, BENCHMARKS & LOGS
      # =========================================================================
      - name: "Step 5 - Run Unit Suite, Prompt/Response Showcase, 2048-Token Prefill & Baselines"
        id: step5_run
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a telemetry_logs/00_workflow_master.log) 2>&1

          APEX_BIN="./Apex-Inference-v1/build/apex.exe"
          LOG_DIR="$(pwd)/telemetry_logs"

          echo "================================================================================"
          echo " [5.1] Running Synthetic GGUF Generation & Full Unit/Parity Verification Suite"
          echo "================================================================================"
          (cd Apex-Inference-v1 && python3 tests/gen_synthetic_gguf.py && python3 tests/test_parity_and_api.py) \
            2>&1 | tee "$LOG_DIR/04_unit_and_synthetic_suite.log"

          QWEN_GGUF=$(python3 -c "import json; d=json.load(open('D:/apex_d_drive/model_manifest.json')); print(d['qwen_paths'][0])")
          echo "Resolved Qwen 3.8 Flash Next GGUF: $QWEN_GGUF"

          echo "================================================================================"
          echo " [5.2] Qwen 3.8 Flash Next — Greedy Parity & Logit ULP Verification"
          echo "================================================================================"
          "$APEX_BIN" verify-parity \
            --model "$QWEN_GGUF" \
            --threads 4 \
            2>&1 | tee "$LOG_DIR/05_qwen38_verify_parity.log"

          echo "================================================================================"
          echo " [5.3] Qwen 3.8 Flash Next — Interactive Prompt & Model Response + Per-Token Trace"
          echo "================================================================================"
          "$APEX_BIN" run \
            --model "$QWEN_GGUF" \
            --prompt "Explain why hybrid Gated DeltaNet + Kimi Delta Attention with 512 Mixture-of-Experts and direct NVMe QD32 IOCP achieves blazing-fast token generation on 16GB RAM:" \
            --gen-tokens 64 \
            --threads 4 \
            --mtp on \
            2>&1 | tee "$LOG_DIR/06_qwen38_prompt_and_response_trace.log"

          echo "================================================================================"
          echo " [5.4] Qwen 3.8 Flash Next — Short Prompt Benchmark (64 Prefill / 128 Decode, MTP ON)"
          echo "================================================================================"
          "$APEX_BIN" bench \
            --model "$QWEN_GGUF" \
            --prompt-tokens 64 \
            --gen-tokens 128 \
            --threads 4 \
            --mtp on \
            --no-hwtest \
            2>&1 | tee "$LOG_DIR/07_qwen38_short_mtp_on.log"

          echo "================================================================================"
          echo " [5.5] Qwen 3.8 Flash Next — Massive 2048-Token Prefill & High KV Load (MTP OFF vs ON A/B)"
          echo "================================================================================"
          "$APEX_BIN" bench \
            --model "$QWEN_GGUF" \
            --prompt-tokens 2048 \
            --gen-tokens 64 \
            --threads 4 \
            --mtp ab \
            --no-hwtest \
            2>&1 | tee "$LOG_DIR/08_qwen38_2048_mtp_ab.log"

          echo "================================================================================"
          echo " [5.6] Comparative Baseline Run — llama.cpp & Colibri on Qwen 3.8 Flash Next"
          echo "================================================================================"
          LLAMA_BENCH=$(find baselines/llama_bin -iname "llama-bench.exe" | head -n 1 || true)
          LLAMA_CLI=$(find baselines/llama_bin -iname "llama-cli.exe" | head -n 1 || true)
          if [ -n "$LLAMA_BENCH" ] && [ -f "$LLAMA_BENCH" ]; then
            echo "Running llama-bench.exe (--no-mmap) on Qwen 3.8 Flash Next..."
            "$LLAMA_BENCH" -m "$QWEN_GGUF" -p 64 -n 64 -t 4 -mmp 0 2>&1 | tee "$LOG_DIR/09_llamacpp_qwen38_bench.log" || true
          fi
          if [ -n "$LLAMA_CLI" ] && [ -f "$LLAMA_CLI" ]; then
            echo "Running llama-cli.exe greedy prompt/response parity check on Qwen 3.8 Flash Next..."
            "$LLAMA_CLI" -m "$QWEN_GGUF" -p "Explain why hybrid Gated DeltaNet + Kimi Delta Attention with 512 Mixture-of-Experts and direct NVMe QD32 IOCP achieves blazing-fast token generation on 16GB RAM:" -n 32 -t 4 --temp 0 --no-mmap --no-cnv 2>&1 | tee "$LOG_DIR/10_llamacpp_cli_response.log" || true
          fi

      # =========================================================================
      # STEP 6: ALWAYS WRITE ALL LOGS TO TOP OF PRIVATE REPO README.md & UPLOAD ARTIFACT
      # =========================================================================
      - name: "Step 6 - Prepend Complete Run Logs to Top of Private Repo README.md (Runs Even on Failure)"
        if: always()
        env:
          SECRET_WRITE_README: ${{ secrets.PRIVATE_REPO_WRITE_LOGS_README }}
          SECRET_PAT_FALLBACK: ${{ secrets.PRIVATE_REPO_PAT }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set +e
          echo "================================================================================"
          echo " [Step 6] Consolidating Telemetry Logs & Writing to Top of Private Repo README.md"
          echo "================================================================================"

          TOKEN="${SECRET_WRITE_README:-$SECRET_PAT_FALLBACK}"
          if [ -z "$TOKEN" ]; then
            echo "[ERROR] Cannot push logs to README.md because PRIVATE_REPO_WRITE_LOGS_README is empty!"
            exit 0
          fi

          rm -rf repo_readme_push
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Grimm67123/apex-inference-v1.git" repo_readme_push
          if [ ! -d "repo_readme_push/.git" ]; then
            echo "[ERROR] Failed to clone Grimm67123/apex-inference-v1 with provided token."
            exit 0
          fi

          cd repo_readme_push
          # Auto-flatten the repository if files are still inside a nested Apex-Inference-v1/ folder!
          if [ ! -f "CMakeLists.txt" ] && [ -f "Apex-Inference-v1/CMakeLists.txt" ]; then
            echo " [Step 6] Auto-flattening nested Apex-Inference-v1/ folder in Grimm67123/apex-inference-v1..."
            shopt -s dotglob
            git mv Apex-Inference-v1/* . 2>/dev/null || mv Apex-Inference-v1/* . 2>/dev/null || true
            rmdir Apex-Inference-v1 2>/dev/null || true
            shopt -u dotglob
          fi

          python3 - << 'EOF'
          import os, glob, datetime

          run_id = os.environ.get("RUN_ID", "unknown")
          run_num = os.environ.get("RUN_NUMBER", "0")
          job_status = os.environ.get("JOB_STATUS", "unknown").upper()
          now_utc = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")

          readme_path = "README.md"
          old_readme = ""
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8", errors="replace") as f:
                  old_readme = f.read()

          # Strip previous auto-prepended log block if present so README stays clean and fresh at top
          start_marker = "<!-- APEX_BENCHMARK_LOGS_START -->"
          end_marker = "<!-- APEX_BENCHMARK_LOGS_END -->"
          if start_marker in old_readme and end_marker in old_readme:
              idx_end = old_readme.find(end_marker) + len(end_marker)
              old_readme = old_readme[idx_end:].lstrip()

          log_files = sorted(glob.glob("../telemetry_logs/*"))
          sections = []
          for lf in log_files:
              fname = os.path.basename(lf)
              if fname == "00_workflow_master.log" and len(log_files) > 2:
                  continue
              try:
                  with open(lf, "r", encoding="utf-8", errors="replace") as f:
                      content = f.read()
                  if len(content) > 120000:
                      content = content[:60000] + "\n\n... [TRUNCATED MIDDLE FOR README LIMIT] ...\n\n" + content[-60000:]
                  sections.append(f"### 📄 `{fname}`\n```text\n{content.strip()}\n```\n")
              except Exception as e:
                  sections.append(f"### 📄 `{fname}`\n```text\nError reading {fname}: {e}\n```\n")

          master_log_path = "../telemetry_logs/00_workflow_master.log"
          if os.path.exists(master_log_path):
              with open(master_log_path, "r", encoding="utf-8", errors="replace") as f:
                  mcontent = f.read()
              if len(mcontent) > 120000:
                  mcontent = mcontent[:60000] + "\n\n... [TRUNCATED] ...\n\n" + mcontent[-60000:]
              sections.insert(0, f"### 🖥️ Consolidated Master Workflow Log (`00_workflow_master.log`)\n```text\n{mcontent.strip()}\n```\n")

          if not sections:
              sections.append("```text\nNo telemetry log files were generated prior to step termination.\n```\n")

          header_block = (
              f"{start_marker}\n"
              f"# 📊 Latest GitHub Actions Benchmark & Diagnostic Telemetry Logs\n\n"
              f"- **Workflow Run**: [#{run_num} (Run ID `{run_id}`)](https://github.com/Grimm67123/apex-inference-benchmarker/actions/runs/{run_id})\n"
              f"- **Status**: **{job_status}**\n"
              f"- **Timestamp**: `{now_utc}`\n\n"
              + "\n".join(sections)
              + f"\n{end_marker}\n\n"
          )

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(header_block + old_readme)
          print(f"[OK] Prepended {len(sections)} log sections to top of README.md ({len(header_block)} bytes).")
          EOF

          git config user.name "apex-benchmark-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "ci: prepend latest benchmark & diagnostic logs to README.md [run ${RUN_ID} - ${JOB_STATUS}]" || true
          git push origin HEAD:main || git push origin HEAD:master || true
          cd ..

      - name: "Upload Full Telemetry Logs Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-inference-v1-telemetry-logs
          path: telemetry_logs/
          retention-days: 30
