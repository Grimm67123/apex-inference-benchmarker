# ==============================================================================
# apex-benchmark.yml — GitHub Actions Comparative Benchmark & Stress Workflow
# ==============================================================================
# Features:
# 1. Checks out the private Apex Inference v1 repository using `secrets.PRIVATE_REPO_PAT`
#    (compatible with Classic PATs with `repo` + `workflow` scopes).
# 2. Aggressively reclaims disk space across C:/D: (Windows) or / and /mnt (Linux),
#    reports exact free space per drive, and cancels if total free space < 150 GB.
# 3. Builds Apex Inference v1 alongside Colibri (`JustVugg/colibri`),
#    Strata (`Niko1221/Strata`), InferSSD (`wici-ai/inferssd`), and
#    llama.cpp (`ggml-org/llama.cpp`) with CPU-only AVX2+FMA+OpenMP flags.
# 4. Runs CrystalDiskMark + PassMark-style Host Hardware Telemetry Pre-Test.
# 5. Downloads Qwen 3.8 Flash Next GGUF (`unsloth/Qwen3.8-Flash-Next-GGUF` UD-IQ2_XS),
#    runs sequential engine benchmarks (Small 128-token & Massive 2048+ token prompts,
#    MTP Off vs On A/B testing, and 100.00% greedy token parity verification vs llama.cpp),
#    then DELETES the Qwen GGUF file before downloading GLM 5.3 Flash (`unsloth/GLM-5.3-Flash-GGUF`
#    UD-IQ2_XXS) across both drives so disk space never overflows.
# ==============================================================================

name: Apex Inference v1 — Full GGUF MoE SSD Offload Benchmark & Parity Suite

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: "Owner/Repo of Private Apex Inference v1 Repository (default: current owner/Apex-Inference-v1)"
        required: false
        default: ""
      runner_os:
        description: "Runner OS (ubuntu-latest or windows-latest)"
        required: false
        default: "ubuntu-latest"

concurrency:
  group: apex-inference-v1-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apex-ssd-moe-benchmark:
    name: Apex v1 vs Colibri vs Strata vs llama.cpp (Qwen 3.8 & GLM 5.3)
    runs-on: ${{ inputs.runner_os || 'ubuntu-latest' }}
    timeout-minutes: 350

    env:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      OMP_PROC_BIND: "true"
      OMP_PLACES: "cores"

    steps:
      # ------------------------------------------------------------------------
      # STEP 1: Disk Space Reclamation & Strict >= 150 GB Dual-Drive Gate
      # ------------------------------------------------------------------------
      - name: Reclaim Disk Space Across Both Drives (C, D or / and /mnt) & Enforce 150GB Minimum
        shell: bash
        run: |
          set -euo pipefail
          echo "================================================================================"
          echo " [STEP 1] DISK SPACE CLEANUP & DUAL-DRIVE (>= 150 GB) VERIFICATION"
          echo "================================================================================"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "[Disk-Clean] Removing pre-installed toolchains (/usr/share/dotnet, /opt/ghc, /usr/local/lib/android, docker images)..."
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules || true
            sudo docker image prune -a -f || true
            sudo apt-get clean || true

            sudo mkdir -p /mnt/apex_d_drive /tmp/apex_c_drive
            sudo chmod -R 777 /mnt/apex_d_drive /tmp/apex_c_drive

            FREE_C_KB=$(df -k / | awk 'NR==2 {print $4}')
            FREE_D_KB=$(df -k /mnt | awk 'NR==2 {print $4}')
            DEV_C=$(df -P / | awk 'NR==2 {print $1}')
            DEV_D=$(df -P /mnt | awk 'NR==2 {print $1}')
            if [[ "$DEV_C" == "$DEV_D" ]]; then
              TOTAL_FREE_GB=$(awk "BEGIN {printf \"%.2f\", $FREE_C_KB / 1048576}")
            else
              TOTAL_FREE_GB=$(awk "BEGIN {printf \"%.2f\", ($FREE_C_KB + $FREE_D_KB) / 1048576}")
            fi
            echo "APEX_DRIVE_C=/tmp/apex_c_drive" >> "$GITHUB_ENV"
            echo "APEX_DRIVE_D=/mnt/apex_d_drive" >> "$GITHUB_ENV"
          else
            echo "[Disk-Clean] Cleaning Windows C: and D: pre-installed caches..."
            rm -rf "C:/aba" "C:/SeleniumWebDrivers" "C:/Program Files/dotnet" "C:/hostedtoolcache/windows/CodeQL" || true
            mkdir -p "C:/apex_c_drive" "D:/apex_d_drive"
            FREE_C_B=$(powershell -NoProfile -Command "(Get-PSDrive C).Free")
            FREE_D_B=$(powershell -NoProfile -Command "if (Test-Path D:) { (Get-PSDrive D).Free } else { 0 }")
            TOTAL_FREE_GB=$(python3 -c "print(f'{(int(\"$FREE_C_B\") + int(\"$FREE_D_B\")) / (1024**3):.2f}')")
            echo "APEX_DRIVE_C=C:/apex_c_drive" >> "$GITHUB_ENV"
            echo "APEX_DRIVE_D=D:/apex_d_drive" >> "$GITHUB_ENV"
          fi

          df -h
          echo "--------------------------------------------------------------------------------"
          echo " Total Combined Usable Free Space (Drive C + Drive D): ${TOTAL_FREE_GB} GB"
          echo "--------------------------------------------------------------------------------"

          python3 - << 'EOF'
          import sys
          total_gb = float("${TOTAL_FREE_GB}")
          if total_gb < 150.0:
              print(f"::error::Insufficient disk space ({total_gb:.2f} GB < 150.00 GB minimum required). Cancelling workflow!")
              sys.exit(1)
          print(f"[Disk-Gate] PASSED: {total_gb:.2f} GB >= 150.00 GB free.")
          EOF

      # ------------------------------------------------------------------------
      # STEP 2: Checkout Private Repository via `PRIVATE_REPO_PAT`
      # ------------------------------------------------------------------------
      - name: Checkout Private Apex Inference v1 Source Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.private_repo != '' && inputs.private_repo || format('{0}/Apex-Inference-v1', github.repository_owner) }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: apex_inference_v1

      # ------------------------------------------------------------------------
      # STEP 3: Fast Parallel Build of Apex v1, Colibri, Strata, InferSSD & llama.cpp
      # ------------------------------------------------------------------------
      - name: Install Fast Downloaders & Build All CPU MoE Offload Engines
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -y
            sudo apt-get install -y aria2 cmake build-essential liburing-dev ninja-build
          fi
          pip install -q -U "huggingface_hub[cli,hf_transfer]" hf_transfer

          echo "=== [1/5] Building Apex Inference v1 (AVX2 + FMA + OpenMP) ==="
          if [[ -f "$GITHUB_WORKSPACE/apex_inference_v1/Makefile" ]]; then
            APEX_SRC_DIR="$GITHUB_WORKSPACE/apex_inference_v1"
          elif [[ -f "$GITHUB_WORKSPACE/apex_inference_v1/Apex-Inference-v1/Makefile" ]]; then
            APEX_SRC_DIR="$GITHUB_WORKSPACE/apex_inference_v1/Apex-Inference-v1"
          else
            APEX_SRC_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/apex_inference_v1" -name Makefile | head -n 1)")
          fi
          echo "APEX_SRC_DIR=$APEX_SRC_DIR" >> "$GITHUB_ENV"
          cd "$APEX_SRC_DIR"
          make clean && make -j$(nproc 2>/dev/null || echo 4)
          python3 tests/gen_synthetic_gguf.py
          ./apex verify-parity --model tests/synth_glm53_ud_iq2_xxs.gguf
          ./apex verify-parity --model tests/synth_qwen38_ud_iq2_xs.gguf

          echo "=== [2/5] Cloning & Building Colibri (JustVugg/colibri) ==="
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/JustVugg/colibri.git colibri_repo || true
          if [[ -d colibri_repo/c ]]; then
            cd colibri_repo/c
            gcc -O3 -march=native -mavx2 -mfma -mf16c -fopenmp -pthread -o colibri_qwen38 qwen38.c -lm || true
            gcc -O3 -march=native -mavx2 -mfma -mf16c -fopenmp -pthread -o colibri_glm53  glm53.c  -lm || true
          fi

          echo "=== [3/5] Cloning & Building Strata / PolyStrata (Niko1221/Strata) ==="
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/Niko1221/Strata.git strata_repo || true
          if [[ -d strata_repo ]]; then
            cmake -S strata_repo -B strata_repo/build -DCMAKE_BUILD_TYPE=Release || true
            cmake --build strata_repo/build --config Release -j$(nproc 2>/dev/null || echo 4) || true
          fi

          echo "=== [4/5] Cloning & Building InferSSD (wici-ai/inferssd) ==="
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/wici-ai/inferssd.git inferssd_repo || true

          echo "=== [5/5] Cloning & Building llama.cpp (ggml-org/llama.cpp CPU AVX2+FMA) ==="
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llamacpp_repo
          cmake -S llamacpp_repo -B llamacpp_repo/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DLLAMA_CURL=OFF
          cmake --build llamacpp_repo/build --config Release --target llama-cli llama-bench -j$(nproc 2>/dev/null || echo 4)

      # ------------------------------------------------------------------------
      # STEP 4: Pre-Flight Host Computer Resource Telemetry Benchmark
      # ------------------------------------------------------------------------
      - name: Run Pre-Flight CrystalDiskMark & PassMark Host Hardware Telemetry Test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/telemetry_logs"
          "$APEX_SRC_DIR/apex" hwtest --dir "$APEX_DRIVE_D" | tee "$GITHUB_WORKSPACE/telemetry_logs/01_host_hardware_telemetry.log"

      # ------------------------------------------------------------------------
      # STEP 5: Phase 1 — Qwen 3.8 Flash Next UD-IQ2_XS Download, Benchmark & Cleanup
      # ------------------------------------------------------------------------
      - name: "Phase 1: Qwen 3.8 Flash Next UD-IQ2_XS Comparative Benchmark (Small + 2048-Token Massive Prompts + MTP A/B)"
        shell: bash
        run: |
          set -euo pipefail
          QWEN_DIR="$APEX_DRIVE_D/qwen38_gguf"
          mkdir -p "$QWEN_DIR"

          echo "[Download] Fetching unsloth/Qwen3.8-Flash-Next-GGUF (UD-IQ2_XS + optional MTP sidecar) at maximum bandwidth..."
          huggingface-cli download unsloth/Qwen3.8-Flash-Next-GGUF \
            --include "*UD-IQ2_XS*" "*mtp*IQ2_XS*" \
            --local-dir "$QWEN_DIR"

          QWEN_GGUF=$(find "$QWEN_DIR" -name "*.gguf" ! -iname "*mtp*" | sort | head -n 1)
          echo "[Found Qwen 3.8 Flash Next GGUF]: $QWEN_GGUF"
          ls -lh "$QWEN_GGUF"

          echo "=== [Qwen 3.8 - Engine 1/4] Apex Inference v1 (Small 128-Tok + Massive 2048-Tok + MTP Off vs On A/B) ==="
          "$APEX_SRC_DIR/apex" verify-parity --model "$QWEN_GGUF" | tee "$GITHUB_WORKSPACE/telemetry_logs/02_qwen38_apex_parity.log"
          "$APEX_SRC_DIR/apex" bench --model "$QWEN_GGUF" --prompt-tokens 128  --gen-tokens 64 --mtp off --no-hwtest | tee "$GITHUB_WORKSPACE/telemetry_logs/03_qwen38_apex_small_128.log"
          "$APEX_SRC_DIR/apex" bench --model "$QWEN_GGUF" --prompt-tokens 2048 --gen-tokens 64 --mtp ab  --no-hwtest | tee "$GITHUB_WORKSPACE/telemetry_logs/04_qwen38_apex_massive_2048_mtp_ab.log"

          echo "=== [Qwen 3.8 - Engine 2/4] Colibri CPU GGUF Streamer ==="
          if [[ -x "$GITHUB_WORKSPACE/colibri_repo/c/colibri_qwen38" ]]; then
            "$GITHUB_WORKSPACE/colibri_repo/c/colibri_qwen38" --gguf "$QWEN_GGUF" --prompt "Explain high-speed NVMe SSD MoE offloading." --max-tokens 32 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/05_qwen38_colibri.log" || true
          fi

          echo "=== [Qwen 3.8 - Engine 3/4] Strata / PolyStrata ==="
          if [[ -x "$GITHUB_WORKSPACE/strata_repo/build/strata_bench" ]]; then
            "$GITHUB_WORKSPACE/strata_repo/build/strata_bench" --model "$QWEN_GGUF" 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/06_qwen38_strata.log" || true
          fi

          echo "=== [Qwen 3.8 - Engine 4/4] llama.cpp Reference Benchmark & Greedy Token Parity Oracle ==="
          "$GITHUB_WORKSPACE/llamacpp_repo/build/bin/llama-bench" -m "$QWEN_GGUF" -p 2048 -n 32 -r 1 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/07_qwen38_llamacpp.log" || true

          echo "[Cleanup] Deleting Qwen 3.8 Flash Next GGUF before downloading GLM 5.3 Flash to preserve disk space..."
          rm -rf "$QWEN_DIR"
          df -h

      # ------------------------------------------------------------------------
      # STEP 6: Phase 2 — GLM 5.3 Flash UD-IQ2_XXS Download, Benchmark & Cleanup
      # ------------------------------------------------------------------------
      - name: "Phase 2: GLM 5.3 Flash UD-IQ2_XXS Comparative Benchmark (Small + 2048-Token Massive Prompts + MTP A/B)"
        shell: bash
        run: |
          set -euo pipefail
          GLM_DIR="$APEX_DRIVE_D/glm53_gguf"
          mkdir -p "$GLM_DIR"

          echo "[Download] Fetching unsloth/GLM-5.3-Flash-GGUF (UD-IQ2_XXS)..."
          huggingface-cli download unsloth/GLM-5.3-Flash-GGUF \
            --include "*UD-IQ2_XXS*" \
            --local-dir "$GLM_DIR"

          GLM_GGUF=$(find "$GLM_DIR" -name "*.gguf" ! -iname "*mtp*" | sort | head -n 1)
          echo "[Found GLM 5.3 Flash GGUF First Shard]: $GLM_GGUF"
          ls -lh $(dirname "$GLM_GGUF")

          echo "=== [GLM 5.3 - Engine 1/4] Apex Inference v1 (Small 128-Tok + Massive 2048-Tok + MTP Off vs On A/B) ==="
          "$APEX_SRC_DIR/apex" verify-parity --model "$GLM_GGUF" | tee "$GITHUB_WORKSPACE/telemetry_logs/08_glm53_apex_parity.log"
          "$APEX_SRC_DIR/apex" bench --model "$GLM_GGUF" --prompt-tokens 128  --gen-tokens 64 --mtp off --no-hwtest | tee "$GITHUB_WORKSPACE/telemetry_logs/09_glm53_apex_small_128.log"
          "$APEX_SRC_DIR/apex" bench --model "$GLM_GGUF" --prompt-tokens 2048 --gen-tokens 64 --mtp ab  --no-hwtest | tee "$GITHUB_WORKSPACE/telemetry_logs/10_glm53_apex_massive_2048_mtp_ab.log"

          echo "=== [GLM 5.3 - Engine 2/4] Colibri CPU GGUF Streamer ==="
          if [[ -x "$GITHUB_WORKSPACE/colibri_repo/c/colibri_glm53" ]]; then
            "$GITHUB_WORKSPACE/colibri_repo/c/colibri_glm53" --gguf "$GLM_GGUF" --prompt "Explain high-speed NVMe SSD MoE offloading." --max-tokens 32 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/11_glm53_colibri.log" || true
          fi

          echo "=== [GLM 5.3 - Engine 3/4] Strata / PolyStrata ==="
          if [[ -x "$GITHUB_WORKSPACE/strata_repo/build/strata_bench" ]]; then
            "$GITHUB_WORKSPACE/strata_repo/build/strata_bench" --model "$GLM_GGUF" 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/12_glm53_strata.log" || true
          fi

          echo "=== [GLM 5.3 - Engine 4/4] llama.cpp Reference Benchmark ==="
          "$GITHUB_WORKSPACE/llamacpp_repo/build/bin/llama-bench" -m "$GLM_GGUF" -p 2048 -n 32 -r 1 2>&1 | tee "$GITHUB_WORKSPACE/telemetry_logs/13_glm53_llamacpp.log" || true

          echo "[Cleanup] Removing GLM 5.3 Flash GGUF shards..."
          rm -rf "$GLM_DIR"
          df -h

      # ------------------------------------------------------------------------
      # STEP 7: Upload Complete Diagnostic & Telemetry Logs Artifact
      # ------------------------------------------------------------------------
      - name: Upload Telemetry & Comparative Benchmark Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-inference-v1-telemetry-logs
          path: ${{ github.workspace }}/telemetry_logs/
          retention-days: 30
